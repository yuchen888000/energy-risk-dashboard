name: Keep dashboard awake

on:
  schedule:
    # Streamlit Community Cloud hibernates after ~12h without traffic.
    # Every 6h gives 2x headroom. Times are UTC (Geneva = UTC+2 in summer).
    - cron: "0 5,11,17,23 * * *"
  # Lets you wake it on demand from the Actions tab before sending an application.
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Visit the app
        env:
          STREAMLIT_URL: https://energy-risk-dashboard-zj3n46fw8txggaj3su3br6.streamlit.app
        run: python .github/scripts/keepalive.py

      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-failure
          path: keepalive-failure.png
          if-no-files-found: ignore
          retention-days: 7
