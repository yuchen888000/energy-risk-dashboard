name: Refresh saved TTF prices

on:
  schedule:
    # Every hour, Tuesday to Saturday. The script saves a day's row only from 05:00 New York the next day, when it is
    # the settlement and not the evening session (92.07 against 91.60 for 3 Nov 2026), so the hour of a run does not
    # matter. GitHub delays scheduled runs by hours (the 06:23 UTC run of 6 Nov started at 14:24), so it is asked
    # every hour. A run that finds nothing new changes nothing.
    - cron: "23 * * * 2-6"
  workflow_dispatch:

concurrency:
  group: refresh-ttf
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install --quiet pandas yfinance

      - name: Download TTF prices
        run: python .github/scripts/refresh_ttf.py

      - name: Commit if the file changed
        run: |
          git diff --quiet -- data/ttf_saved.csv && { echo "No change."; exit 0; }
          git config user.name "yuchen888000"
          git config user.email "150667104+yuchen888000@users.noreply.github.com"
          git add data/ttf_saved.csv
          git commit -m "Saved TTF prices: daily update"
          git pull --rebase origin main
          git push
